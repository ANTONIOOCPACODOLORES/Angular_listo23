<div class="container mt-4">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>País</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let persona of personas"> <!-- Asegúrate que sea 'personas' -->
          <td>{{ persona.id }}</td>
          <td>{{ persona.nombre }}</td>
          <td>{{ persona.apellido }}</td>
          <td>{{ persona.pais }}</td>
        </tr>
      </tbody>
    </table>
  </div>
